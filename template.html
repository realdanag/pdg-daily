<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:M;font-weight:400;src:url(fonts/montserrat-latin-400-normal.woff2)}
@font-face{font-family:M;font-weight:500;src:url(fonts/montserrat-latin-500-normal.woff2)}
@font-face{font-family:M;font-weight:600;src:url(fonts/montserrat-latin-600-normal.woff2)}
@font-face{font-family:M;font-weight:700;src:url(fonts/montserrat-latin-700-normal.woff2)}
@font-face{font-family:M;font-weight:900;src:url(fonts/montserrat-latin-900-normal.woff2)}
@font-face{font-family:S;src:url(fonts/sacramento-latin-400-normal.woff2)}
/* Gobold High if supplied, otherwise Anton */
:root{--gold:#FFC107;--white:#fff;--navy:#011632;--m:96px}
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1350px;overflow:hidden;font-family:M,sans-serif}
.c{position:relative;width:1080px;height:1350px;overflow:hidden;
  background:linear-gradient(135deg,#032F65 0%,#022452 45%,#011631 80%,#010F21 100%)}
.ghost{position:absolute;left:0;top:0;width:1080px;height:1350px}
.date{position:absolute;left:var(--m);top:var(--m);display:flex;align-items:center;gap:22px}
.date .num{font-weight:900;font-size:104px;line-height:.78;color:var(--gold);letter-spacing:-3px}
.date .rule{width:3px;height:78px;background:var(--gold)}
.date .meta{font-weight:700;font-size:22px;letter-spacing:6px;color:var(--white);line-height:1.55;text-transform:uppercase}
.date .meta span{display:block;font-weight:900;font-size:36px;color:var(--white);letter-spacing:4px;line-height:1.1;margin-top:4px}
.logo{position:absolute;right:var(--m);top:88px;width:230px}
.hair{position:absolute;left:var(--m);right:var(--m);top:300px;height:1px;background:rgba(255,193,7,.45)}
.head{position:absolute;left:var(--m);top:500px;width:888px}
.script{position:absolute;left:0;top:-150px;font-family:S;font-size:210px;line-height:1;color:var(--gold);-webkit-text-stroke:4px var(--gold);
  z-index:3;white-space:nowrap;text-shadow:0 8px 18px rgba(0,0,0,.45)}
.l1,.l2{font-weight:900;font-size:228px;line-height:.86;letter-spacing:-6px;text-transform:uppercase;white-space:nowrap;margin-left:-10px;width:max-content}
.l1{color:var(--white);position:relative;z-index:2}
.l2{color:var(--gold)}
.body{position:absolute;left:var(--m);top:1020px;width:640px;font-weight:500;font-size:28px;line-height:1.45;color:var(--white)}
.body:before{content:"";display:block;width:64px;height:4px;background:var(--gold);margin-bottom:22px}
.band{position:absolute;left:0;right:0;bottom:0;height:116px;background:var(--gold);display:flex;align-items:center;justify-content:space-between;padding:0 var(--m)}
.band .handle{height:40px}
.band .tag{font-weight:700;font-size:17px;letter-spacing:6px;color:var(--navy);text-transform:uppercase}
.band{z-index:4}
.pat-b .band{background:var(--gold)}
.pat-b .band:after{content:"";position:absolute;right:0;top:0;bottom:0;width:52%;
  background:repeating-linear-gradient(135deg,transparent 0 14px,rgba(1,22,50,.85) 14px 16.5px),repeating-linear-gradient(45deg,transparent 0 14px,rgba(1,22,50,.85) 14px 16.5px);
  -webkit-mask:linear-gradient(90deg,transparent,#000 35%)}
.pat-b .band .tag{display:none}
.pat-c .band{background:none;height:170px;align-items:flex-end;padding-bottom:38px}
.pat-c .band:before{content:"";position:absolute;inset:0;background:var(--gold);clip-path:polygon(0 42%,100% 0,100% 100%,0 100%);z-index:-1}
.pat-c .band:after{content:"";position:absolute;left:0;right:0;top:-34px;height:71.4px;z-index:-1;
  background:linear-gradient(to bottom right,transparent calc(50% - 2px),var(--gold) calc(50% - 2px),var(--gold) calc(50% + 1px),transparent calc(50% + 1px));opacity:.7}
.pat-c .band .tag{color:var(--navy)}
</style></head><body>
<div class="c" id="c">
  <svg class="ghost" id="ghost" viewBox="0 0 1080 1350"></svg>
  <div class="date">
    <div class="num" id="num">09</div><div class="rule"></div>
    <div class="meta"><b id="mon">Nov 2026</b><span id="day">Monday</span></div>
  </div>
  <img class="logo" src="logo.png">
    <div class="head">
    <div class="script" id="script">Happy</div>
    <div class="l1" id="l1">New</div>
    <div class="l2" id="l2">Week</div>
  </div>
  <div class="body" id="body">Fresh week, fresh ideas. Show up, create boldly and make every day count.</div>
  <div class="band"><img class="handle" src="handle_navy.png"><div class="tag">Elevating Visual Elements</div></div>
</div>

for(const ch of n){h+=`<path fill="rgba(0,8,24,.38)" transform="translate(${x},${base}) scale(${sc},${-sc})" d="${DG.g[ch].d}"/>`;x+=adv;}
